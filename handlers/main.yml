---
- name: Kill guacd
  ansible.builtin.command: pkill guacd
  become: true
  when: guacd_config.install

- name: Restart guacd
  ansible.builtin.service:
    name: guacd
    state: restarted
  become: true
  when: guacd_config.install

- name: Restart tomcat10
  ansible.builtin.service:
    name: tomcat10
    state: restarted
  become: true
