---
# Guacamole dependencies on Ubuntu 24-04 repos
guacamole_ubuntu_deps:
  - "{{ guacamole_tomcat }}"
  - build-essential
  - dpkg-dev
  - freerdp2-x11
  - ghostscript
  - libavcodec-dev
  - libavutil-dev
  - libcairo2-dev
  - freerdp2-dev
  - libjpeg-turbo8-dev
  - libossp-uuid-dev
  - libpango1.0-dev
  - libpng-dev
  - libpulse-dev
  - libssh2-1-dev
  - libssl-dev
  - libswscale-dev
  - libtelnet-dev
  - libvncserver-dev
  - libvorbis-dev
  - libwebp-dev

# Guacamole version to install (and corresponding download URL)
guacamole_version: 1.6.0
guacamole_dl_url: "{{ 'https://downloads.apache.org/guacamole/' + guacamole_version }}"
guacamole_server_package: "{{ 'guacamole-server-' + guacamole_version + '.tar.gz' }}"
guacamole_client_package: "{{ 'guacamole-' + guacamole_version + '.war' }}"
guacamole_auth_ldap_package: "{{ 'guacamole-auth-ldap-' + guacamole_version + '.tar.gz' }}"
guacamole_ldap_package: "{{ guacamole_auth_ldap_package }}"

# Where to install Guacamole
guacamole_src_dir: /usr/local/src

# Name of the Tomcat user and Tomcat service.
# Both depend on the distro and ansible version.
# Read the docs before overriding defaults.
# Check: https://github.com/mrlesmithjr/ansible-guacamole/blob/master/tasks/set_facts.yml
# Also, note that if you change the name of the Tomcat service you need to add a corresponding handler to restart the service!
# Check handlers/main.yml.
guacamole_tomcat: tomcat10
guacamole_tomcat_user: tomcat
guacamole_tomcat_service: tomcat10

# For now, use Guacamole built-in authentication
guacamole_basic_user_mapping: /etc/guacamole/user-mapping.xml
guacamole_auth_provider: net.sourceforge.guacamole.net.basic.BasicFileAuthenticationProvider
guacamole_server_hostname: localhost

# Authorized users
guacamole_users: []
  # - name: user1
  #   password: password
  #   connections:
  #     - host: 172.16.32.11
  #       name: csirt2
  #       protocol: vnc
  #       port: 5901
  #       user: csirt2
  #       password: mozart.rocks
  #     - host: 172.16.32.12
  #       name: csirt3
  #       protocol: vnc
  #       port: 5901
  #       user: csirt3
  #       password: mozart.rocks

# Install the guacamole daemon
guacd_config:
  install: true

# RDP settings
guacamole_rdp_color_depth: 24
guacamole_rdp_disable_auth: false
guacamole_rdp_height: 900
guacamole_rdp_width: 1440
guacamole_rdp_security: rdp
guacamole_rdp_ignore_cert: false

# LDAP authentication
guacamole_ldap_enable: false
guacamole_ldap_hostname: localhost
guacamole_ldap_port: 389
guacamole_ldap_encryption_method: none  # none, ssl, starttls
guacamole_ldap_ssl_protocol: TLSv1.3
guacamole_ldap_user_base_dn: ""
guacamole_ldap_username_attribute: uid
guacamole_ldap_search_bind_dn: ""
guacamole_ldap_search_bind_password: ""
guacamole_ldap_config_base_dn: ""
guacamole_ldap_group_base_dn: ""
guacamole_ldap_group_name_attribute: cn
guacamole_ldap_user_search_filter: ""
guacamole_ldap_group_search_filter: ""
guacamole_ldap_user_attributes: ""
guacamole_ldap_member_attribute: member
guacamole_ldap_member_attribute_type: dn
guacamole_ldap_dereference_aliases: never
guacamole_ldap_follow_referrals: false
guacamole_ldap_max_referral_hops: 5
guacamole_ldap_operation_timeout: 30
guacamole_ldap_max_search_results: 1000

